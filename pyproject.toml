[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "higher-order-combinatorial-structures"
version = "0.1.0"
description = "Reproducible research code for higher-order combinatorial structures under low-order statistical constraints"
readme = "README.md"
requires-python = ">=3.10"
authors = []
dependencies = []
keywords = ["combinatorial structures", "2-switch", "higher-order", "integer feasibility", "reproducible research"]

[tool.setuptools.packages.find]
where = ["src"]
